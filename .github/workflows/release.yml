name: Release

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  attach:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: package
          merge-multiple: true
      - name: Attach package to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          packages=(package/*.nupkg)
          package="${packages[0]}"
          name="${package##*/}"
          digest="sha256:$(sha256sum "$package" | cut -d ' ' -f 1)"
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" |
            jq -r --arg name "$name" '.[] | select(.name == $name) | .digest // "missing-digest"')
          if [[ -z "$existing" ]]; then
            gh release upload "$GITHUB_REF_NAME" "$package" --repo "$GITHUB_REPOSITORY"
          elif [[ "$existing" != "$digest" ]]; then
            echo "::error::The release already has an asset with the same name and a different digest."
            exit 1
          fi

  publish-github:
    needs: [build, attach]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: package
          merge-multiple: true
      - name: Publish to GitHub Packages
        env:
          PACKAGE_TOKEN: ${{ github.token }}
        run: |
          config="$RUNNER_TEMP/github-packages.config"
          cat > "$config" <<EOF
          <configuration>
            <packageSources>
              <add key="github" value="https://nuget.pkg.github.com/$GITHUB_REPOSITORY_OWNER/index.json" />
            </packageSources>
          </configuration>
          EOF
          export NuGetPackageSourceCredentials_github="Username=$GITHUB_ACTOR;Password=$PACKAGE_TOKEN"
          dotnet nuget push package/*.nupkg --skip-duplicate --api-key "$PACKAGE_TOKEN" \
            --source github --configfile "$config"

  publish-nuget:
    needs: [build, attach]
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: package
          merge-multiple: true
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push package/*.nupkg --skip-duplicate --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json
